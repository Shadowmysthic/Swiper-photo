name: SwipeFoto
options:
  bundleIdPrefix: com.swipefoto
  deploymentTarget:
    iOS: "16.0"
targets:
  SwipeFoto:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Swipe Foto
        NSPhotoLibraryUsageDescription: Untuk memilih dan menghapus foto yang kamu pilih sendiri
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swipefoto.app
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
